[tool.poetry]
name = "nilm-pipeline"
version = "0.1.0"
description = "Event-based NILM pipeline (minute data, 3-phase) with FastAPI"
authors = ["Your Name <you@example.com>"]
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.11"
pandas = "^2.2.2"
numpy = "^1.26.4"
scipy = "^1.13.1"
scikit-learn = "^1.5.1"
statsmodels = "^0.14.2"
matplotlib = "^3.9.0"
fastapi = "^0.115.0"
uvicorn = {extras=["standard"], version="^0.30.6"}
mysql-connector-python = "^9.0.0"
python-dotenv = "^1.0.1"
pydantic = "^2.8.2"

[tool.poetry.group.dev.dependencies]
black = "^24.8.0"
ruff = "^0.6.4"
pytest = "^8.2.0"
httpx = "^0.27.0"

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
select = ["E","F","I","UP","B"]
ignore = ["E501"]
