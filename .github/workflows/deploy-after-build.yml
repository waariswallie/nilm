name: Deploy After Build (Self-Hosted)

on:
  workflow_run:
    workflows: ["Build (Image only)"]
    types: [completed]

jobs:
  deploy:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          (github.event.workflow_run.head_branch == 'main' || github.event.workflow_run.head_branch == 'init') }}
    runs-on: [self-hosted, linux, arm64, pi]
    permissions:
      contents: read
      packages: read
    concurrency:
      group: deploy-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: false
    steps:
      - name: Show triggering context
        run: |
          echo "Triggered by build workflow run: $GITHUB_RUN_ID"
          echo "Branch: ${{ github.event.workflow_run.head_branch }}"
          echo "SHA: ${{ github.event.workflow_run.head_sha }}"
      - name: Checkout repository at built commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Set meta (always force)
        id: meta
        shell: bash
        run: |
          echo "branch=${{ github.event.workflow_run.head_branch }}" >> $GITHUB_OUTPUT
          echo "force=true" >> $GITHUB_OUTPUT
          echo "Always forcing redeploy after successful build."
      - name: Run deploy.sh (forced)
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/deploy.sh
          ./scripts/deploy.sh --branch "${{ steps.meta.outputs.branch }}" --force
      - name: Show running container
        run: |
          docker ps --filter name=nilm-app-${{ steps.meta.outputs.branch }} || true
