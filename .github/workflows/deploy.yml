name: Build & Deploy (Raspberry Pi)

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64,amd64
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract version
        id: meta
        run: |
          echo "VERSION=${GITHUB_SHA::7}" >> $GITHUB_ENV
      - name: Build & Push (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/nilm-app:latest
            ghcr.io/${{ github.repository_owner }}/nilm-app:${{ env.VERSION }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.RPI_HOST }}
          username: ${{ secrets.RPI_USER }}
          key: ${{ secrets.RPI_SSH_KEY }}
          port: ${{ secrets.RPI_PORT }}
          script: |
            set -e
            mkdir -p ~/nilm
            cd ~/nilm
            echo "Pull image"
            docker pull ghcr.io/${{ github.repository_owner }}/nilm-app:latest
            if [ ! -f docker-compose.yml ]; then
              echo "Create docker-compose.yml"
              printf "%s\n" \
                "services:" \
                "  nilm-app:" \
                "    image: ghcr.io/${{ github.repository_owner }}/nilm-app:latest" \
                "    container_name: nilm-app" \
                "    restart: unless-stopped" \
                "    env_file:" \
                "      - .env" \
                "    ports:" \
                "      - 8000:8000" > docker-compose.yml
            fi
            echo "Deploy stack"
            docker compose down || true
            docker compose up -d
            echo "Deployed"