name: Build & Deploy (Raspberry Pi)

on:
  push:
    branches: [ main, init ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64,amd64
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract version
        id: meta
        run: |
          echo "VERSION=${GITHUB_SHA::7}" >> $GITHUB_ENV
      - name: Compute tags
        id: tags
        run: |
          BRANCH="${GITHUB_REF##*/}"
          SAFE_BRANCH=${BRANCH//[^a-zA-Z0-9_-]/-}
          echo "BRANCH_NAME=$BRANCH" >> $GITHUB_ENV
          echo "SAFE_BRANCH=$SAFE_BRANCH" >> $GITHUB_ENV
          echo "IMAGE_BASE=ghcr.io/${{ github.repository_owner }}/nilm-app" >> $GITHUB_ENV
          echo "TAGS=ghcr.io/${{ github.repository_owner }}/nilm-app:${SAFE_BRANCH}-latest,ghcr.io/${{ github.repository_owner }}/nilm-app:${SAFE_BRANCH}-${VERSION}" >> $GITHUB_OUTPUT
      - name: Build & Push (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.TAGS }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Validate required secrets
        run: |
          set -e
          missing=0
          for var in RPI_HOST RPI_USER RPI_SSH_KEY; do
            if [ -z "${!var}" ]; then
              echo "::error title=Missing secret::$var is not set (Settings > Secrets and variables > Actions)";
              missing=1
            fi
          done
          if [ "$missing" -eq 1 ]; then
            echo "One or more required secrets are missing. Aborting deploy.";
            exit 1
          fi
        env:
          RPI_HOST: ${{ secrets.RPI_HOST }}
          RPI_USER: ${{ secrets.RPI_USER }}
          RPI_SSH_KEY: ${{ secrets.RPI_SSH_KEY }}
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          # Required connection parameters (defined as repository secrets)
          host: ${{ secrets.RPI_HOST }}
          username: ${{ secrets.RPI_USER }}
          key: ${{ secrets.RPI_SSH_KEY }}
          # Optional: fallback to 22 if RPI_PORT not provided
          port: ${{ secrets.RPI_PORT || 22 }}
          script: |
            set -e
            BRANCH="${GITHUB_REF##*/}"
            SAFE_BRANCH=${BRANCH//[^a-zA-Z0-9_-]/-}
            IMAGE="ghcr.io/${{ github.repository_owner }}/nilm-app:${SAFE_BRANCH}-latest"
            # Map branch to port (main=8000, init=8001 default)
            PORT=8000
            if [ "$BRANCH" = "init" ]; then PORT=8001; fi
            APP_DIR=~/nilm-$SAFE_BRANCH
            mkdir -p "$APP_DIR"
            cd "$APP_DIR"
            echo "Pull image $IMAGE"
            docker pull "$IMAGE"
            COMPOSE_FILE=docker-compose.yml
            echo "Generate compose file ($COMPOSE_FILE)"
            printf "%s\n" \
              "services:" \
              "  nilm-app:" \
              "    image: $IMAGE" \
              "    container_name: nilm-app-$SAFE_BRANCH" \
              "    restart: unless-stopped" \
              "    env_file:" \
              "      - .env" \
              "    ports:" \
              "      - $PORT:8000" > $COMPOSE_FILE
            if [ ! -f .env ]; then
              echo "WARNING: .env missing in $APP_DIR (create it to configure).";
            fi
            echo "Deploy stack ($BRANCH)"
            docker compose down || true
            docker compose up -d
            echo "Deployed branch $BRANCH on port $PORT"