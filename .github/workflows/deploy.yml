name: Build (Image only)

on:
  push:
    branches: [ main, init ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64,amd64
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract version
        id: meta
        run: |
          echo "VERSION=${GITHUB_SHA::7}" >> $GITHUB_ENV
      - name: Compute tags
        id: tags
        run: |
          BRANCH="${GITHUB_REF##*/}"
          SAFE_BRANCH=${BRANCH//[^a-zA-Z0-9_-]/-}
          echo "BRANCH_NAME=$BRANCH" >> $GITHUB_ENV
          echo "SAFE_BRANCH=$SAFE_BRANCH" >> $GITHUB_ENV
          echo "IMAGE_BASE=ghcr.io/${{ github.repository_owner }}/nilm-app" >> $GITHUB_ENV
          echo "TAGS=ghcr.io/${{ github.repository_owner }}/nilm-app:${SAFE_BRANCH}-latest,ghcr.io/${{ github.repository_owner }}/nilm-app:${SAFE_BRANCH}-${VERSION}" >> $GITHUB_OUTPUT
      - name: Build & Push (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.TAGS }}
      - name: Inspect pushed image (multi-arch manifest)
        run: |
          echo "Inspecting manifest for branch $BRANCH_NAME ($SAFE_BRANCH)" 
          docker buildx imagetools inspect ghcr.io/${{ github.repository_owner }}/nilm-app:${SAFE_BRANCH}-latest || echo "Manifest inspect failed (image may not have pushed)."
