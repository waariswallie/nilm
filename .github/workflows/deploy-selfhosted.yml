name: Deploy (Self-Hosted Pi Pull)

on:
  push:
    branches: [ main, init ]
  workflow_dispatch:
    inputs:
      force:
        description: 'Force redeploy (ignore digest check)'
        required: false
        default: 'false'

jobs:
  deploy:
    runs-on: [self-hosted, linux, arm64, pi]
    permissions:
      contents: read
      packages: read
    steps:
      - name: Show context
        run: |
          echo "Actor: $GITHUB_ACTOR"
          echo "Ref: $GITHUB_REF"
          echo "SHA: $GITHUB_SHA"
          echo "Runner: $(uname -a)"
          echo "Commit message (first line):"; git log -1 --pretty=%s || true
      - name: Checkout repo (for deploy.sh)
        uses: actions/checkout@v4
      - name: Determine deploy flags
        id: meta
        shell: bash
        run: |
          BRANCH="${GITHUB_REF##*/}"; echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          FORCE_INPUT="${{ github.event.inputs.force }}"
          COMMIT_MSG=$(git log -1 --pretty=%B | tr -d '\r')
          FORCE_FLAG="false"
          if echo "$COMMIT_MSG" | grep -qi '\[force-deploy\]'; then FORCE_FLAG="true"; fi
          if [ "$FORCE_INPUT" = "true" ]; then FORCE_FLAG="true"; fi
          echo "force=$FORCE_FLAG" >> $GITHUB_OUTPUT
          echo "Force flag resolved to: $FORCE_FLAG"
      - name: Run deploy.sh on Pi runner
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/deploy.sh
          CMD=("./scripts/deploy.sh" "--branch" "${{ steps.meta.outputs.branch }}")
          if [ "${{ steps.meta.outputs.force }}" = "true" ]; then CMD+=("--force"); fi
          echo "Run: ${CMD[*]}"
          "${CMD[@]}"
      - name: Show running containers
        run: |
          docker ps --filter name=nilm-app-${{ steps.meta.outputs.branch }} || true
